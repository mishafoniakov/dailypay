name: dailypay
version: "1.0.0"
config-version: 2
profile: dailypay
require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  "dbt_date:time_zone": "Europe/Moscow"

models:
  dailypay:
    staging:
      +schema: stage
      +materialized: view
    datamarts:
      +schema: datamarts
      +materialized: table
