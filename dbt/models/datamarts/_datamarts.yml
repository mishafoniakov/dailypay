version: 2

models:
  - name: expence_day
    description: Расходы по дням
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount > 0"
    columns:
      - name: txn_date
        tests: [unique, not_null]
      - name: amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
  - name: expence_month
    description: Расходы по месяцам
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - txn_year
              - txn_month
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount > 0"
    columns:
      - name: txn_year
        tests: [not_null]
      - name: txn_month
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 12
      - name: amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
  - name: income_month
    description: Доходы по месяцам
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - txn_year
              - txn_month
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount > 0"
    columns:
      - name: txn_year
        tests: [not_null]
      - name: txn_month
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 12
      - name: amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
