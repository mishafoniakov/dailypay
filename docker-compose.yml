x-airflow-common: &airflow-common
  image: apache/airflow:2.10.0
  env_file: .env
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB}
    AIRFLOW__LOGGING__DAG_PROCESSOR_LOG_TARGET: stdout
    PYTHONPATH: /opt/airflow
    DATA_DIR: /data
    AIRFLOW_CONN_FINANCE_DWH: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    DBT_PROFILES_DIR: /opt/dbt
    _PIP_ADDITIONAL_REQUIREMENTS: minio pdfplumber pangres dbt-postgres==1.10.2
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}

services:
  minio:
    image: pgsty/minio:latest
    container_name: dailypay_minio
    env_file: .env
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/minio:latest
    container_name: dailypay_minio_init
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$MINIO_BUCKET

  postgres:
    image: postgres:16
    container_name: dailypay_postgres
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init-airflow-db.sh:/docker-entrypoint-initdb.d/init-airflow-db.sh

  dbt:
    build:
      context: ./dbt
    image: dailypay-dbt
    container_name: dailypay_dbt
    env_file: .env
    environment:
      DBT_PROFILES_DIR: /usr/app
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dbt", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: dailypay_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username $$AIRFLOW_ADMIN_USERNAME --password $$AIRFLOW_ADMIN_PASSWORD --firstname $$AIRFLOW_ADMIN_FIRSTNAME --lastname $$AIRFLOW_ADMIN_LASTNAME --role Admin --email $$AIRFLOW_ADMIN_EMAIL || true
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: dailypay_airflow_webserver
    hostname: dailypay_airflow_webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./airflow/engines:/opt/airflow/engines
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt
      - ./data:/data
      - ./dbt:/opt/dbt
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: dailypay_airflow_scheduler
    hostname: dailypay_airflow_scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./airflow/engines:/opt/airflow/engines
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt
      - ./data:/data
      - ./dbt:/opt/dbt
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  minio_data:
  pg_data:
  airflow_logs:
